name: PropVista CRM
description_template: |
  <!--
  Thanks for contributing to PropVista CRM!

  BEFORE SUBMITTING AN ISSUE, PLEASE REVIEW THE FOLLOWING:

  1. Check if the issue has already been reported by searching in the
