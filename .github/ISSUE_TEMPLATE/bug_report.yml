name: Bug Report
description: Report a bug or issue
title: "[BUG] <brief description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the template below to help us investigate.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you observe the bug?
      options:
        - Development
        - Staging
        - Production
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs & Screenshots
      description: Please attach any relevant logs, error messages, or screenshots
      placeholder: Paste logs or drag and drop screenshots here
    validations:
      required: false