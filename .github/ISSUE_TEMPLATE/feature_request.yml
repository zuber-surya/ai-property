name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] <brief description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the template below to help us understand your request.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the feature request
      placeholder: What feature would you like to see added?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation / Use Case
      description: Why is this feature needed? What problem does it solve?
      placeholder: Explain the use case or problem this feature would address
    validations:
      required: true
  - type: textarea
    id: specification-reference
    attributes:
      label: Related Specification (if any)
      description: Does this relate to any existing spec sections?
      placeholder: e.g. 01-prd.md §XX, 04-api-spec.md §YY
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Related Considerations
      description: Please consider the following
      options:
        - label: This feature requires updates to documentation
        - label: This feature may affect performance
        - label: This feature has security implications
        - label: This feature requires database changes
    validations:
      required: false