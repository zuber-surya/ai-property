<style>

<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopNavBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-desktop py-4 max-w-container-max mx-auto bg-surface-container-lowest/80 backdrop-blur-xl border-b border-outline-variant/30">
<div class="font-display-lg text-display-lg tracking-tight text-primary">PropVista</div>
<nav class="hidden md:flex gap-8 items-center">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Properties</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Insights</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Resources</a>
<button class="ml-4 px-6 py-2 bg-primary text-on-primary rounded-full font-label-md hover:opacity-90 scale-95 active:scale-90 transition-transform">Contact Sales</button>
</nav>
</header>
<main class="flex-grow flex items-center justify-center pt-24 pb-12 px-margin-mobile relative overflow-hidden">
<!-- Abstract Background Illustration -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full pointer-events-none z-0 opacity-40">

</div>
<!-- Auth Card -->
<div class="glass-card w-full max-w-[540px] rounded-xl border border-outline-variant/30 shadow-xl z-10 flex flex-col overflow-hidden">
<!-- Bento Box Header Section -->
<div class="p-stack-md border-b border-outline-variant/20 bg-surface-container-low/50">
<div class="flex items-center gap-4 mb-stack-sm">
<div class="w-12 h-12 rounded-lg bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined">security</span>
</div>
<div>
<h1 class="font-headline-md text-headline-md text-on-surface">Secure Access</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant">PropVista Intelligence Engine</p>
</div>
</div>
<!-- Tab Switcher -->
<div class="flex p-1 bg-surface-container-high rounded-lg mt-stack-md">
<button class="flex-1 py-2 rounded-md font-label-md tab-transition bg-surface-container-lowest text-primary shadow-sm" id="loginTab" onclick="switchTab('login')">
                        Log in
                    </button>
<button class="flex-1 py-2 rounded-md font-label-md tab-transition text-on-surface-variant hover:text-primary" id="registerTab" onclick="switchTab('register')">
                        Register
                    </button>
</div>
</div>
<!-- Login View -->
<div class="p-stack-md md:p-stack-lg space-y-stack-md" id="loginForm">
<div class="space-y-stack-sm">
<label class="block font-label-sm text-label-sm text-on-surface-variant ml-1">Email address</label>
<input class="auth-input w-full px-5 py-4 rounded-xl border-none bg-surface-container-low text-on-surface font-body-md placeholder:text-outline/50 transition-all focus:ring-2 focus:ring-primary" placeholder="name@company.com" type="email"/>
</div>
<div class="space-y-stack-sm">
<div class="flex justify-between items-center px-1">
<label class="font-label-sm text-label-sm text-on-surface-variant">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<input class="auth-input w-full px-5 py-4 rounded-xl border-none bg-surface-container-low text-on-surface font-body-md placeholder:text-outline/50 transition-all focus:ring-2 focus:ring-primary" placeholder="••••••••" type="password"/>
</div>
<div class="flex items-center gap-3 px-1">
<input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface" for="remember">Remember me for 30 days</label>
</div>
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-label-md text-lg hover:opacity-95 transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2 group">
                    Log in
                    <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="relative py-2 flex items-center">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="px-4 font-label-sm text-label-sm text-outline">or continue with enterprise SSO</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<button class="w-full py-4 border border-outline-variant bg-transparent text-on-surface rounded-xl font-label-md flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors">
<img class="w-5 h-5" data-alt="A clean, minimalist representation of a multi-colored Google logo, using soft high-key lighting to integrate into a professional enterprise software UI theme. The icon is rendered with crisp edges against a neutral background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCLEQBCXSMEHs5aeunNrw0QuVVoV_TXJ72IryinGyCsBAYOGsHfH0F9D059_1oE09iKy1Nt2crar_WxdjNgc82EuKvWsw5I6wtlHt-Jg8XwZnIJoJSB1HzSrkEjRpQmbuUI376y1sdEsgZtxhTkv4Icr24o1KlzSARx7IUjwk-SfvAccTG_hOmXtB9rCKmeiY7daU3HN64ueCatZO6NT4ZNl9928Et9er5FJiwiqYlKtwDuedcgFsGWww"/>
                    Google Workspace
                </button>

</div>
<div class="space-y-base">
<label class="block font-label-sm text-label-sm text-on-surface-variant ml-1">Phone</label>
<input class="auth-input w-full px-5 py-4 rounded-xl border-none bg-surface-container-low text-on-surface font-body-md transition-all focus:ring-2 focus:ring-primary" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div class="space-y-base">
<label class="block font-label-sm text-label-sm text-on-surface-variant ml-1">Work Email</label>
<input class="auth-input w-full px-5 py-4 rounded-xl border-none bg-surface-container-low text-on-surface font-body-md transition-all focus:ring-2 focus:ring-primary" placeholder="john@agency.com" type="email"/>
</div>
<div class="space-y-base">
<label class="block font-label-sm text-label-sm text-on-surface-variant ml-1">Password</label>
<input class="auth-input w-full px-5 py-4 rounded-xl border-none bg-surface-container-low text-on-surface font-body-md transition-all focus:ring-2 focus:ring-primary" placeholder="Create a strong password" type="password"/>
</div>
<div class="flex items-start gap-3 px-1">

</div>
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-label-md text-lg hover:opacity-95 transition-all shadow-lg shadow-primary/20">
                    Create account

<footer class="w-full py-8 px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-stack-md bg-background border-t border-outline-variant/20">
<div class="flex flex-col items-center md:items-start gap-2">
<span class="font-headline-md text-headline-md text-on-surface">PropVista</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">© 2024 PropVista CRM. All rights reserved.</p>
</div>
<div class="flex gap-8">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Help Center</a>
</div>
</footer>
<script>
        function switchTab(type) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (type === 'login') {
                // Tab styling
                loginTab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                loginTab.classList.remove('text-on-surface-variant');
                registerTab.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                registerTab.classList.add('text-on-surface-variant');
                
                // Form visibility
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                // Tab styling
                registerTab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                registerTab.classList.remove('text-on-surface-variant');
                loginTab.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                loginTab.classList.add('text-on-surface-variant');

                // Form visibility
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        // Simple entrance animation
        window.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.glass-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            setTimeout(() => {
                card.style.transition = 'all 0.6s cubic-bezier(0.22, 1, 0.36, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
